<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="/fidelity-bank-ui/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Fidelity Bank</title>

    <link rel="icon" type="image/png" href="favicon.png">


    <!-- ✅ Shared CSS (Standard Order) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">

    <!-- ✅ Page-Specific CSS -->
    <link rel="stylesheet" href="css/forgot-password.css">

    <style>
        .footer-badges {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 20px !important;
            flex-wrap: wrap !important;
            margin: 24px 0 !important;
            width: 100% !important;
        }
        
        .footer-badges img {
            display: inline-block !important;
            vertical-align: middle !important;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header id="shared-header"></header>

    <!-- MAIN CONTENT -->
    <main class="auth-page">
        <div class="auth-card">
            <h1>Reset Your Password</h1>
            <p class="auth-subtitle">Enter your username or email address. We'll send you a link to reset your password.</p>

            <form class="auth-form">
                <div class="form-group">
                    <label for="email">Username / Email Address</label>
                    <input type="text" id="email" name="email" placeholder="Enter your username or email" required>
                </div>

                <button type="submit" class="btn-primary-full">Send Reset Link</button>

                <div class="auth-links">
                    <a href="login.html">← Back to Sign In</a>
                </div>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer id="shared-footer"></footer>

    <!-- ✅ Scripts (Standard Order) -->
    <script src="js/header.js"></script>
    <script src="js/page-load.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/forgot-password.js"></script>
    <script src="js/sidebar.js"></script>
</body>

</html>
