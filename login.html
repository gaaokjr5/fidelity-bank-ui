<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Fidelity Bank</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Shared CSS — Same order -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Page-specific styles -->
</head>

<body>

    <!-- HEADER — Loaded from shared component -->
    <div id="header-placeholder"></div>

    <!-- ==========================================
  LOGIN SECTION
========================================== -->
    <section class="login-section">
        <div class="container">
            <div class="login-card">
                <div class="login-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your Fidelity Bank account</p>
                </div>

                <form id="loginForm" novalidate>
                    <div class="input-group">
                        <label for="username">Username / Email</label>
                        <input type="text" id="username" name="username" required aria-required="true" placeholder="Enter your username or email">
                        <span id="username-error" class="error-text" role="alert">Please enter your username or email</span>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required aria-required="true" placeholder="Enter your password">
                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁</button>
                        </div>
                        <span id="password-error" class="error-text" role="alert">Please enter your password</span>
                    </div>

                    <label class="checkbox-label">
          <input type="checkbox" name="remember">
          <span>Remember Me</span>
        </label>

                    <!-- ✅ Change your form action OR button click -->
                    <form class="auth-form" action="dashboard.html">
                        <!-- ... your form fields ... -->
                        <button type="submit" class="btn-primary-full">Sign In</button>
                    </form>

                    <div class="login-links">
                        <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                        <span>•</span>
                        <a href="open-account.html">Open an Account</a>
                    </div>
                </form>

                <div class="divider">
                    <span>Or</span>
                </div>

                <div class="quick-login-options">
                    <!-- ✅ LOGIN WITH MOBILE APP — Icon + Text -->
                    <button class="login-option-btn">
  <img src="images/icons/icon-mobile.svg" alt="Mobile App" class="btn-icon">
  Login with Mobile App
</button>

                    <!-- ✅ INTERNET BANKING — Icon + Text -->
                    <button class="login-option-btn">
  <img src="images/icons/icon-laptop.svg" alt="Internet Banking" class="btn-icon">
  Internet Banking
</button>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER — Loaded from shared component -->
    <div id="footer-placeholder"></div>

    <!-- ==========================================
  SCRIPTS
========================================== -->
    <script src="js/page-load.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/load-components.js"></script>
    <script src="js/sidebar.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const toggleBtn = document.querySelector('.toggle-password');

            // Toggle password visibility
            toggleBtn.addEventListener('click', () => {
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                toggleBtn.textContent = type === 'password' ? '👁' : '🙈';
            });

            // Form validation & submission
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                let isValid = true;

                // Validate Username
                if (!username.value.trim()) {
                    username.closest('.input-group').classList.add('error');
                    isValid = false;
                } else {
                    username.closest('.input-group').classList.remove('error');
                }

                // Validate Password
                if (!password.value.trim()) {
                    password.closest('.input-group').classList.add('error');
                    isValid = false;
                } else {
                    password.closest('.input-group').classList.remove('error');
                }

                if (isValid) {
                    alert('🔐 Login Submitted!\n\nIn a real implementation, you would be authenticated and redirected to your dashboard.');
                    form.reset();
                }
            });
        });
    </script>

</body>

</html>
